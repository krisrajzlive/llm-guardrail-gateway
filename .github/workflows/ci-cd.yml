name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  # Gate 1 - every PR and push: lint, types, unit tests with fake models, offline eval harness.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest
      - name: Offline eval harness (deterministic, no keys)
        run: python -m evals.run --offline --min-score 1.0

  # Gate 2 - push to main only: live evals against all three Bedrock models.
  # Not run on pull requests, so AWS credentials never reach fork code.
  eval-gate:
    outputs:
      prompt_id: ${{ steps.prompt.outputs.prompt_id }}
    needs: [test, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EVAL_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Mask AWS account id in public logs
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - name: Sync prompts/chat to the Bedrock managed prompt (DRAFT)
        id: prompt
        run: python scripts/prompt_registry.py sync --github-output
      - name: Live multi-LLM eval of the DRAFT prompt (exit 1 below threshold => deploy is skipped)
        run: python -m evals.run
        env:
          PROMPT_ID: ${{ steps.prompt.outputs.prompt_id }}
          # optional repo variable: one threshold for every model (otherwise evals/thresholds.json)
          EVAL_MIN_SCORE: ${{ vars.EVAL_MIN_SCORE }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/latest.json

  # Only reached if test, secret-scan and eval-gate all succeeded.
  deploy:
    needs: [test, secret-scan, eval-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      STACK_NAME: llm-guardrail-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Mask AWS account id in public logs
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - name: Publish the gated prompt as an immutable version
        id: prompt
        run: python scripts/prompt_registry.py publish --prompt-id "${{ needs.eval-gate.outputs.prompt_id }}" --github-output
      - name: Build
        run: sam build --template-file infra/template.yaml
      - name: Deploy
        run: >
          sam deploy
          --stack-name "$STACK_NAME"
          --s3-bucket "${{ vars.ARTIFACT_BUCKET }}"
          --capabilities CAPABILITY_IAM
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides
          "PromptId=${{ steps.prompt.outputs.prompt_id }}"
          "PromptVersion=${{ steps.prompt.outputs.prompt_version }}"
      - name: Smoke test (health, then one live call)
        run: |
          aws lambda invoke --function-name "$STACK_NAME" --cli-binary-format raw-in-base64-out \
            --payload '{"health": true}' health.json > /dev/null
          jq -e '.statusCode == 200' health.json
          jq -e --arg v "${{ steps.prompt.outputs.prompt_version }}" '.body | fromjson | .prompt_version == $v' health.json
          aws lambda invoke --function-name "$STACK_NAME" --cli-binary-format raw-in-base64-out \
            --payload '{"prompt": "How do I return an item?", "model": "claude"}' live.json > /dev/null
          # on-topic for the support persona; assert a healthy, non-blocked answer rather than exact wording
          jq -e '.statusCode == 200 and (.body | fromjson | .output | length > 20 and (contains("I can'"'"'t provide that response") | not))' live.json
