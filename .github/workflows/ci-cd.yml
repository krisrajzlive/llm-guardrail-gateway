name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gate 1 - every PR and push: lint, types, unit tests with fake models, offline eval harness.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest
      - name: Offline eval harness (deterministic, no keys)
        run: python -m evals.run --offline --min-score 1.0

  # Gate 2 - push to main only: live evals against all three Bedrock models.
  # Not run on pull requests, so AWS credentials never reach fork code.
  eval-gate:
    needs: [test, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_EVAL_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Live multi-LLM eval (exit 1 below threshold => deploy is skipped)
        run: python -m evals.run --min-score ${{ vars.EVAL_MIN_SCORE || '0.85' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/latest.json

  # Only reached if test, secret-scan and eval-gate all succeeded.
  deploy:
    needs: [test, secret-scan, eval-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      STACK_NAME: llm-guardrail-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build
        run: sam build --template-file infra/template.yaml
      - name: Deploy
        run: >
          sam deploy
          --stack-name "$STACK_NAME"
          --s3-bucket "${{ vars.ARTIFACT_BUCKET }}"
          --capabilities CAPABILITY_IAM
          --no-confirm-changeset
          --no-fail-on-empty-changeset
      - name: Smoke test (health, then one live call)
        run: |
          aws lambda invoke --function-name "$STACK_NAME" --cli-binary-format raw-in-base64-out \
            --payload '{"health": true}' health.json > /dev/null
          jq -e '.statusCode == 200' health.json
          aws lambda invoke --function-name "$STACK_NAME" --cli-binary-format raw-in-base64-out \
            --payload '{"prompt": "Reply with exactly the word: pong", "model": "claude"}' live.json > /dev/null
          jq -e '.statusCode == 200 and (.body | fromjson | .output | ascii_downcase | contains("pong"))' live.json
