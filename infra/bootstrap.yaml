AWSTemplateFormatVersion: "2010-09-09"
Description: One-time bootstrap - GitHub OIDC trust, scoped deploy and eval roles, SAM artifact bucket.

Parameters:
  GitHubRepo:
    Type: String
    Description: owner/name of the GitHub repository allowed to deploy
  OidcSubjectPrefix:
    Type: String
    Default: ""
    Description: >
      Subject prefix of the repository's OIDC tokens. New repositories use immutable claims
      (repo:<owner>@<owner-id>/<name>@<repo-id>); get it from
      `gh api repos/<owner>/<name>/actions/oidc/customization/sub`. Empty falls back to repo:<owner>/<name>.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set false if the account already has the token.actions.githubusercontent.com provider
  ExistingOidcProviderArn:
    Type: String
    Default: ""

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]
  HasSubjectPrefix: !Not [!Equals [!Ref OidcSubjectPrefix, ""]]

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub llm-guardrail-gateway-artifacts-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: llm-guardrail-gateway-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # A job with `environment: production` presents the environment-form subject,
              # not the ref-form one, so both are allowed. PRs and other branches cannot deploy.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Join [":", [!If [HasSubjectPrefix, !Ref OidcSubjectPrefix, !Sub "repo:${GitHubRepo}"], "ref:refs/heads/main"]]
                  - !Join [":", [!If [HasSubjectPrefix, !Ref OidcSubjectPrefix, !Sub "repo:${GitHubRepo}"], "environment:production"]]
      Policies:
        - PolicyName: deploy-llm-guardrail-gateway
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Stack
                Effect: Allow
                Action: cloudformation:*
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/llm-guardrail-gateway/*
              - Sid: PublishPromptVersion
                Effect: Allow
                Action: [bedrock:GetPrompt, bedrock:CreatePromptVersion]
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:prompt/*
              - Sid: ListPrompts
                Effect: Allow
                Action: bedrock:ListPrompts
                Resource: "*"
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: TemplateSummary
                Effect: Allow
                Action: cloudformation:GetTemplateSummary
                Resource: "*"
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:GetBucketLocation, s3:ListBucket]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*
              - Sid: Function
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:llm-guardrail-gateway*
              - Sid: FunctionRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/llm-guardrail-gateway-*

  # Used only by the live eval gate: can call Bedrock models, nothing else. Pushes to main only.
  EvalRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: llm-guardrail-gateway-github-eval
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Join [":", [!If [HasSubjectPrefix, !Ref OidcSubjectPrefix, !Sub "repo:${GitHubRepo}"], "ref:refs/heads/main"]]
      Policies:
        - PolicyName: sync-prompt-draft
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock:UpdatePrompt, bedrock:GetPrompt]
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:prompt/*
              # Create/List do not support resource-level scoping (the prompt does not exist yet).
              - Effect: Allow
                Action: [bedrock:CreatePrompt, bedrock:ListPrompts]
                Resource: "*"
        - PolicyName: invoke-bedrock-models
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*

Outputs:
  EvalRoleArn:
    Value: !GetAtt EvalRole.Arn
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
