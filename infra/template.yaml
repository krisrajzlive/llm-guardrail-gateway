AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: llm-guardrail-gateway - multi-model (Amazon Bedrock) LLM agent with tracing and inline evals

Resources:
  Function:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: llm-guardrail-gateway
      CodeUri: ../src/
      Handler: llm_guardrail_gateway.handler.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 90
      Policies:
        # Bedrock auth is the function's IAM role: no API keys exist anywhere in this system.
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
      FunctionUrlConfig:
        AuthType: AWS_IAM

Outputs:
  FunctionName:
    Value: !Ref Function
  FunctionUrl:
    Description: SigV4-signed (AWS_IAM) endpoint
    Value: !GetAtt FunctionUrl.FunctionUrl
